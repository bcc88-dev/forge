<!DOCTYPE html>
<html data-theme="dark">
<head>
<title>Welcome to the Coolest Tool on Jennifer</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root {
  --bg-color: #000000;
  --text-color: #ffffff;
  --accent-color: #00d4ff;
  --menu-bg: #1a1a2e;
  --menu-hover: #2a2a4e;
  --submenu-bg: #0d0d1a;
}

[data-theme="light"] {
  --bg-color: #ffffff;
  --text-color: #1a1a2e;
  --accent-color: #0066cc;
  --menu-bg: #f0f0f0;
  --menu-hover: #e0e0e0;
  --submenu-bg: #e8e8e8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-color);
  color: var(--text-color);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  min-height: 100vh;
  transition: background 0.3s, color 0.3s;
}

.nav {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 100;
}

.menu-btn {
  background: none;
  border: 2px solid var(--accent-color);
  color: var(--accent-color);
  font-size: 24px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.menu-btn:hover {
  background: var(--accent-color);
  color: var(--bg-color);
}

.dropdown {
  position: absolute;
  top: 50px;
  left: 0;
  background: var(--menu-bg);
  border: 1px solid var(--accent-color);
  border-radius: 8px;
  min-width: 180px;
  opacity: 0;
  visibility: hidden;
  transform: translateY(-10px);
  transition: all 0.2s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.dropdown.show {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.dropdown-item {
  padding: 12px 16px;
  cursor: pointer;
  transition: background 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
}

.dropdown-item:first-child {
  border-radius: 8px 8px 0 0;
}

.dropdown-item:last-child {
  border-radius: 0 0 8px 8px;
}

.dropdown-item:hover {
  background: var(--menu-hover);
}

.dropdown-divider {
  height: 1px;
  background: var(--accent-color);
  opacity: 0.3;
  margin: 4px 0;
}

.theme-toggle {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 100;
}

.toggle-btn {
  background: var(--menu-bg);
  border: 2px solid var(--accent-color);
  color: var(--accent-color);
  padding: 10px 20px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 8px;
}

.toggle-btn:hover {
  background: var(--accent-color);
  color: var(--bg-color);
}

.toggle-icon {
  font-size: 18px;
}

.main-content {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 20px;
  text-align: center;
}

h1 {
  color: var(--accent-color);
  font-size: clamp(2rem, 5vw, 3.5rem);
  margin-bottom: 20px;
  text-shadow: 0 0 30px var(--accent-color);
}

.subtitle {
  color: var(--text-color);
  opacity: 0.7;
  font-size: 1.3em;
  margin-bottom: 10px;
}

.footer {
  margin-top: 40px;
  opacity: 0.5;
  font-size: 0.9em;
}
</style>
</head>
<body>
  <nav class="nav">
    <button class="menu-btn" onclick="toggleMenu()">···</button>
    <div class="dropdown" id="menuDropdown">
      <div class="dropdown-item" onclick="location.reload()">Reload Page</div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item" onclick="window.open('https://github.com','_blank')">GitHub</div>
      <div class="dropdown-item" onclick="window.open('https://docker.com','_blank')">Docker Docs</div>
      <div class="dropdown-divider"></div>
      <div class="dropdown-item">Container Info</div>
      <div class="dropdown-item">Server Time: <span id="serverTime"></span></div>
    </div>
  </nav>

  <div class="theme-toggle">
    <button class="toggle-btn" onclick="toggleTheme()">
      <span class="toggle-icon" id="themeIcon">☀️</span>
      <span id="themeText">Light Mode</span>
    </button>
  </div>

  <main class="main-content">
    <h1>Welcome to the Coolest Tool on Jennifer</h1>
    <p class="subtitle">You just spun up nginx like a boss!</p>
    <div class="footer">Powered by Docker + nginx</div>
  </main>

  <script>
    function toggleMenu() {
      document.getElementById('menuDropdown').classList.toggle('show');
    }

    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      document.getElementById('themeIcon').textContent = next === 'dark' ? '☀️' : '🌙';
      document.getElementById('themeText').textContent = next === 'dark' ? 'Light Mode' : 'Dark Mode';
    }

    document.addEventListener('click', function(e) {
      const nav = document.querySelector('.nav');
      if (!nav.contains(e.target)) {
        document.getElementById('menuDropdown').classList.remove('show');
      }
    });

    setInterval(() => {
      document.getElementById('serverTime').textContent = new Date().toLocaleTimeString();
    }, 1000);
    document.getElementById('serverTime').textContent = new Date().toLocaleTimeString();
  </script>
</body>
</html>
