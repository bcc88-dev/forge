[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clide-cli"
version = "0.1.0"
description = "CLIDE - The AI coding agent that never forgets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "CLIDE AI", email = "hello@clide-cli.vercel.app"},
]
dependencies = [
    "rich>=13.0",
    "requests>=2.28",
    "urllib3>=1.26",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Code Generators",
]

[project.urls]
Home = "https://clide-cli.vercel.app"
Source = "https://github.com/bcc88-dev/forge"
Documentation = "https://clide-cli.vercel.app/docs"

[project.scripts]
clide = "forge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
forge = ["py.typed"]
