<!DOCTYPE html>
<html lang=\"en\">
<head>
    <meta charset=\"UTF-8\">
    <title>Snake Game</title>
    <style>
        body { margin:0; padding:0; background:#111; display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:Arial,sans-serif; }
        canvas { background:#222; border:2px solid #555; }
        #score { color:#fff; font-size:24px; margin-bottom:10px; }
        #instructions { color:#888; font-size:14px; margin-top:10px; }
    </style>
</head>
<body>
    <div id=\"score\">Score: 0</div>
    <canvas id=\"game\" width=\"400\" height=\"400\"></canvas>
    <div id=\"instructions\">Use Arrow Keys to play</div>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        let snake = [{x:10,y:10}];
        let dx = 1, dy = 0;
        let food = {x:15,y:15};
        let score = 0;
        let gameOver = false;
        let gameLoopId;
        function drawSnake() { ctx.fillStyle='#0f0'; snake.forEach((s,i)=>{ctx.fillRect(s.x*gridSize,s.y*gridSize,gridSize-2,gridSize-2); if(i===0){ctx.fillStyle='#0a0';}});}
        function drawFood() { ctx.fillStyle='#f00'; ctx.fillRect(food.x*gridSize,food.y*gridSize,gridSize-2,gridSize-2);}
        function moveSnake() { if(gameOver)return; let head={x:snake[0].x+dx,y:snake[0].y+dy}; if(head.x<0||head.x>=tileCount||head.y<0||head.y>=tileCount){endGame();return;} for(let i=1;i<snake.length;i++){if(head.x===snake[i].x&&head.y===snake[i].y){endGame();return;}} snake.unshift(head); if(head.x===food.x&&head.y===food.y){score++;placeFood();} else{snake.pop();}}
        function placeFood() { let valid=false; while(!valid){food.x=Math.floor(Math.random()*tileCount);food.y=Math.floor(Math.random()*tileCount);valid=true;snake.forEach(s=>{if(s.x===food.x&&s.y===food.y)valid=false;});}}
        function endGame() { gameOver=true; ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.fillStyle='#fff'; ctx.font='30px Arial'; ctx.textAlign='center'; ctx.fillText('Game Over!',canvas.width/2,canvas.height/2-20); ctx.font='20px Arial'; ctx.fillText('Score: '+score,canvas.width/2,canvas.height/2+20); ctx.font='16px Arial'; ctx.fillText('Press R to restart',canvas.width/2,canvas.height/2+60);}
        function reset() { snake=[{x:10,y:10}];dx=1;dy=0;score=0;gameOver=false;placeFood();}
        function render() { ctx.fillStyle='#111'; ctx.fillRect(0,0,canvas.width,canvas.height); drawFood(); drawSnake(); scoreEl.textContent='Score: '+score; }
        function loop() { if(!gameOver){moveSnake();} render(); gameLoopId=setTimeout(loop,100); }
        document.addEventListener('keydown',e=>{ if(gameOver&&e.key==='r'){reset();} if(e.key==='ArrowUp'&&dy===0){dx=0;dy=-1;} else if(e.key==='ArrowDown'&&dy===0){dx=0;dy=1;} else if(e.key==='ArrowLeft'&&dx===0){dx=-1;dy=0;} else if(e.key==='ArrowRight'&&dx===0){dx=1;dy=0;}});
        placeFood(); loop();
    </script>
</body>
</html>
